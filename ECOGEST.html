// ════════════════════════════════════════════════════════════════════
const mention = (n) => n >= 16 ? ["Très bien", C.green] : n >= 14 ? ["Bien", C.navy] : n >= 10 ? ["Passable", C.orange] : ["Insuffisant", C.red];

const Badge = ({ children, color = C.orange, size = 12 }) => (
  <span style={{ background: color + "18", color, border: `1px solid ${color}40`, borderRadius: 20, padding: "2px 9px", fontSize: size, fontWeight: 500, whiteSpace: "nowrap" }}>{children}</span>
);

const Btn = ({ children, onClick, variant = "primary", small, disabled, style = {} }) => (
  <button onClick={onClick} disabled={disabled} style={{
    padding: small ? "6px 14px" : "9px 18px", borderRadius: 8, border: "none",
    cursor: disabled ? "not-allowed" : "pointer", fontSize: small ? 12 : 13,
    fontWeight: 600, fontFamily: "inherit", opacity: disabled ? 0.5 : 1,
    background: variant === "primary" ? C.orange : variant === "navy" ? C.navy : variant === "danger" ? C.red : C.light,
    color: ["primary","navy","danger"].includes(variant) ? C.white : "#333",
    transition: "opacity 0.15s", ...style,
  }}>{children}</button>
);

const Input = ({ label, ...p }) => (
  <div style={{ marginBottom: 13 }}>
    {label && <label style={{ fontSize: 12, fontWeight: 600, color: "#555", display: "block", marginBottom: 4 }}>{label}</label>}
    <input {...p} style={{ width: "100%", padding: "8px 11px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", ...p.style }} />
  </div>
);

const Sel = ({ label, children, ...p }) => (
  <div style={{ marginBottom: 13 }}>
    {label && <label style={{ fontSize: 12, fontWeight: 600, color: "#555", display: "block", marginBottom: 4 }}>{label}</label>}
    <select {...p} style={{ width: "100%", padding: "8px 11px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", background: C.white }}>{children}</select>
  </div>
);

const Modal = ({ title, onClose, children, width = 480 }) => (
  <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center" }}>
    <div style={{ background: C.white, borderRadius: 14, padding: 28, width, maxWidth: "92vw", boxShadow: "0 24px 64px rgba(0,0,0,0.22)", maxHeight: "90vh", overflowY: "auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <h3 style={{ margin: 0, color: C.navy, fontSize: 16 }}>{title}</h3>
        <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: "#aaa" }}>✕</button>
      </div>
      {children}
    </div>
  </div>
);

const DataTable = ({ cols, rows, emptyMsg = "Aucune donnée" }) => (
  <div style={{ overflowX: "auto" }}>
    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
      <thead>
        <tr style={{ background: C.light }}>
          {cols.map((c, i) => <th key={i} style={{ padding: "10px 13px", textAlign: "left", fontWeight: 600, color: "#555", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.05em", borderBottom: `1px solid ${C.border}`, whiteSpace: "nowrap" }}>{c.label}</th>)}
        </tr>
      </thead>
      <tbody>
        {rows.length === 0
          ? <tr><td colSpan={cols.length} style={{ padding: 28, textAlign: "center", color: "#bbb", fontSize: 13 }}>{emptyMsg}</td></tr>
          : rows.map((row, i) => (
            <tr key={i} style={{ borderBottom: `1px solid ${C.light}` }}>
              {cols.map((c, j) => <td key={j} style={{ padding: "10px 13px", color: "#333" }}>{c.render ? c.render(row[c.key], row) : row[c.key]}</td>)}
            </tr>
          ))}
      </tbody>
    </table>
  </div>
);

const Card = ({ children, style = {} }) => (
  <div style={{ background: C.white, border: `1px solid ${C.border}`, borderRadius: 12, ...style }}>{children}</div>
);

const StatCard = ({ label, value, color, icon }) => (
  <div style={{ background: C.white, border: `1px solid ${C.border}`, borderRadius: 12, padding: "16px 20px", flex: 1, minWidth: 110, borderTop: `3px solid ${color}` }}>
    <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, display: "flex", alignItems: "center", gap: 6 }}><span>{icon}</span>{label}</div>
    <div style={{ fontSize: 26, fontWeight: 700, color }}>{value}</div>
  </div>
);

const PageHeader = ({ title, sub, action }) => (
  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
    <div>
      <h2 style={{ color: C.navy, margin: 0, fontSize: 20 }}>{title}</h2>
      {sub && <p style={{ color: C.muted, fontSize: 13, margin: "4px 0 0" }}>{sub}</p>}
    </div>
    {action}
  </div>
);

const Toast = ({ msg }) => msg ? (
  <div style={{ position: "fixed", bottom: 24, right: 24, background: C.navy, color: C.white, padding: "12px 20px", borderRadius: 10, fontSize: 13, fontWeight: 500, zIndex: 2000, boxShadow: "0 8px 24px rgba(0,0,0,0.2)" }}>
    ✓ {msg}
  </div>
) : null;

// ════════════════════════════════════════════════════════════════════
//  MODULE : DASHBOARD (Directrice + Admin)
// ════════════════════════════════════════════════════════════════════
function Dashboard({ data, role }) {
  const moy = data.notes.length ? (data.notes.reduce((s, n) => s + n.note, 0) / data.notes.length).toFixed(1) : "—";
  const tauxPres = data.presences.length ? Math.round(data.presences.filter(p => p.statut === "Présent").length / data.presences.length * 100) : 0;

  return (
    <div>
      <PageHeader title="Tableau de bord" sub={`Bienvenue sur ECOGEST — École Supérieure de Rabat`} />
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 24 }}>
        <StatCard label="Étudiants actifs"   value={data.etudiants.filter(e => e.statut === "Actif").length} color={C.navy}   icon="🎓" />
        <StatCard label="Professeurs"         value={data.professeurs.length}  color={C.green}  icon="👨‍🏫" />
        <StatCard label="Cours dispensés"     value={data.cours.length}        color={C.orange} icon="📚" />
        <StatCard label="Moyenne générale"    value={`${moy}/20`}              color={C.purple} icon="📊" />
        <StatCard label="Taux de présence"    value={`${tauxPres}%`}           color={C.green}  icon="✅" />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
        <Card style={{ padding: 20 }}>
          <h4 style={{ margin: "0 0 14px", color: C.navy, fontSize: 14 }}>Derniers étudiants inscrits</h4>
          {data.etudiants.slice(0, 4).map(e => (
            <div key={e.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${C.light}` }}>
              <div>
                <div style={{ fontWeight: 600, fontSize: 13 }}>{e.prenom} {e.nom}</div>
                <div style={{ fontSize: 11, color: C.muted }}>{e.filiere} — {e.annee} année · {e.email}</div>
              </div>
              <Badge color={e.statut === "Actif" ? C.green : C.muted}>{e.statut}</Badge>
            </div>
          ))}
        </Card>

        <Card style={{ padding: 20 }}>
          <h4 style={{ margin: "0 0 14px", color: C.navy, fontSize: 14 }}>Dernières notes saisies</h4>
          {data.notes.slice(0, 4).map(n => {
            const [men, col] = mention(n.note);
            return (
              <div key={n.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${C.light}` }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{n.etudiant}</div>
                  <div style={{ fontSize: 11, color: C.muted }}>{n.module} — {n.semestre}</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontWeight: 700, color: col, fontSize: 15 }}>{n.note}/20</div>
                  <Badge color={col} size={10}>{men}</Badge>
                </div>
              </div>
            );
          })}
        </Card>
      </div>

      <Card style={{ padding: 20 }}>
        <h4 style={{ margin: "0 0 14px", color: C.navy, fontSize: 14 }}>Annonces récentes</h4>
        {data.annonces.map(a => (
          <div key={a.id} style={{ display: "flex", gap: 14, padding: "10px 0", borderBottom: `1px solid ${C.light}` }}>
            <div style={{ width: 36, height: 36, borderRadius: 8, background: C.navyLight, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>📢</div>
            <div>
              <div style={{ fontWeight: 600, fontSize: 13, color: C.navy }}>{a.titre}</div>
              <div style={{ fontSize: 12, color: "#555", margin: "2px 0" }}>{a.contenu}</div>
              <div style={{ fontSize: 11, color: C.muted }}>{a.auteur} · {a.date} · <Badge size={10} color={C.navy}>{a.cible}</Badge></div>
            </div>
          </div>
        ))}
      </Card>
    </div>
  );
}

function Etudiants({ data, setData, role, toast }) {
  const canEdit = ["administrateur", "directrice"].includes(role);
  const [search, setSearch] = useState("");
  const [showModal, setShowModal] = useState(false);
  const [form, setForm] = useState({ nom:"", prenom:"", cne:"", filiere:"MGE", annee:"1ère", email:"", statut:"Actif", genre:"M" });

  const filtered = data.etudiants.filter(e =>
    `${e.nom} ${e.prenom} ${e.cne} ${e.email}`.toLowerCase().includes(search.toLowerCase())
  );

  const handleSave = () => {
    const newEt = { ...form, id: Date.now() };
    setData(d => ({ ...d, etudiants: [...d.etudiants, newEt] }));
    // En production : await spAdd(SP.lists.etudiants, newEt)
    toast("Étudiant enregistré dans SharePoint ✓");
    setShowModal(false);
    setForm({ nom:"", prenom:"", cne:"", filiere:"MGE", annee:"1ère", email:"", statut:"Actif", genre:"M" });
  };

  return (
    <div>
      <PageHeader
        title="Étudiants"
        sub={`${filtered.length} étudiant(s) — données stockées dans SharePoint ECOGEST`}
        action={canEdit && <Btn onClick={() => setShowModal(true)}>+ Ajouter un étudiant</Btn>}
      />
      <input placeholder="🔍  Rechercher par nom, CNE ou email..." value={search}
        onChange={e => setSearch(e.target.value)}
        style={{ width: "100%", padding: "10px 14px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, marginBottom: 14, boxSizing: "border-box", fontFamily: "inherit" }} />

      <Card style={{ overflow: "hidden" }}>
        <DataTable
          cols={[
            { key:"cne",     label:"CNE" },
            { key:"prenom",  label:"Prénom" },
            { key:"nom",     label:"Nom" },
            { key:"genre",   label:"Genre", render: v => v === "F" ? "Femme" : "Homme" },
            { key:"filiere", label:"Filière" },

// ════════════════════════════════════════════════════════════════════
function Notes({ data, setData, role, toast }) {
  const canEdit = ["administrateur", "professeur"].includes(role);
  const isEtudiant = role === "etudiant";
  const [showModal, setShowModal] = useState(false);
  const [filter, setFilter] = useState("");
  const [form, setForm] = useState({ etudiantId:"", etudiant:"", module:"", note:"", semestre:"S1", coef:1, date: new Date().toISOString().split("T")[0] });

  const rows = isEtudiant
    ? data.notes.filter(n => n.etudiantId === 1) // en prod: id de l'étudiant connecté
    : data.notes.filter(n => !filter || n.semestre === filter);

  const moy = rows.length ? (rows.reduce((s, n) => s + n.note, 0) / rows.length).toFixed(2) : "—";

  const handleSave = () => {
    const et = data.etudiants.find(e => e.id === parseInt(form.etudiantId));
    const newNote = { ...form, id: Date.now(), note: parseFloat(form.note), etudiant: et ? `${et.prenom} ${et.nom}` : form.etudiant };
    setData(d => ({ ...d, notes: [...d.notes, newNote] }));
    // En production : await spAdd(SP.lists.notes, newNote)
    toast("Note enregistrée dans SharePoint ✓");
    setShowModal(false);
  };

  return (
    <div>
      <PageHeader
        title="Notes & Résultats"
        sub={`Moyenne : ${moy}/20 — liste SharePoint "${SP.lists.notes}"`}
        action={canEdit && <Btn onClick={() => setShowModal(true)}>+ Saisir une note</Btn>}
      />

      {!isEtudiant && (
        <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
          {["", "S1","S2","S3","S4","S5","S6"].map(s => (
            <button key={s} onClick={() => setFilter(s)} style={{
              padding: "5px 14px", borderRadius: 20, border: `1px solid ${C.border}`,
              background: filter === s ? C.navy : C.white, color: filter === s ? C.white : "#555",
              fontSize: 12, cursor: "pointer", fontFamily: "inherit"
            }}>{s || "Tous"}</button>
          ))}
        </div>
      )}

      <Card style={{ overflow: "hidden" }}>
        <DataTable
          cols={[
            { key:"etudiant",  label:"Étudiant" },
            { key:"module",    label:"Module" },
            { key:"semestre",  label:"Semestre" },
            { key:"coef",      label:"Coef." },
            { key:"note",      label:"Note /20", render: v => {
              const [, col] = mention(v);
              return <span style={{ fontWeight: 700, color: col, fontSize: 14 }}>{v}</span>;
            }},
            { key:"note", label:"Mention", render: v => { const [men, col] = mention(v); return <Badge color={col}>{men}</Badge>; }},
            { key:"date",      label:"Date" },
          ]}
          rows={rows}
          emptyMsg="Aucune note enregistrée"
        />
      </Card>

      {showModal && (
        <Modal title="Saisir une note → SharePoint" onClose={() => setShowModal(false)}>
          <Sel label="Étudiant *" value={form.etudiantId} onChange={e => setForm(f => ({ ...f, etudiantId: e.target.value }))}>
            <option value="">-- Sélectionner un étudiant --</option>
            {data.etudiants.map(e => <option key={e.id} value={e.id}>{e.prenom} {e.nom} — {e.filiere}</option>)}
          </Sel>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
            <Input label="Module *" value={form.module} onChange={e => setForm(f => ({ ...f, module: e.target.value }))} />
            <Sel label="Semestre" value={form.semestre} onChange={e => setForm(f => ({ ...f, semestre: e.target.value }))}>
              {["S1","S2","S3","S4","S5","S6"].map(s => <option key={s}>{s}</option>)}
            </Sel>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "0 14px" }}>
            <Input label="Note /20 *" type="number" min="0" max="20" step="0.25" value={form.note} onChange={e => setForm(f => ({ ...f, note: e.target.value }))} />
            <Input label="Coefficient" type="number" min="1" max="5" value={form.coef} onChange={e => setForm(f => ({ ...f, coef: e.target.value }))} />
            <Input label="Date" type="date" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
          </div>
          {form.note && <div style={{ background: "#f0fff4", border: "1px solid #9ae6b4", borderRadius: 8, padding: "8px 14px", fontSize: 12, color: C.green, marginBottom: 12 }}>
            {(() => { const [men, col] = mention(parseFloat(form.note)); return `Mention : ${men}`; })()}
          </div>}
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <Btn variant="light" onClick={() => setShowModal(false)}>Annuler</Btn>
            <Btn onClick={handleSave} disabled={!form.etudiantId || !form.module || !form.note}>Enregistrer → SharePoint</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

const FILIERES = ["MGE", "GRH", "Finance", "Marketing", "Informatique de Gestion", "Commerce International"];
const TARIFS_PAR_FILIERE = {
  "MGE": 18000, "GRH": 17000, "Finance": 18000,
  "Marketing": 17000, "Informatique de Gestion": 19000, "Commerce International": 18000,
};

function FicheVisiteur({ visiteur, onClose, onConvertir, canEdit }) {
  const [doc, setDoc] = useState(visiteur.documents || []);
  const [tarif, setTarif] = useState(visiteur.tarif || []);

  const handleUpload = (e, type) => {
    const file = e.target.files[0];
    if (!file) return;
    const newDoc = { type, nom: file.name, date: new Date().toISOString().split("T")[0], taille: `${(file.size/1024).toFixed(0)} Ko` };
    setDoc(d => [...d, newDoc]);
  };

  const totalTarif = tarif.reduce((s, t) => s + t.montant, 0);
  const totalPaye = tarif.filter(t => t.paye).reduce((s, t) => s + t.montant, 0);

  return (
    <Modal title={`Fiche Visiteur — ${visiteur.prenom} ${visiteur.nom}`} onClose={onClose} width={680}>
      {/* Statut */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20, padding:"10px 14px", background: visiteur.statut === "Inscrit" ? "#f0fff4" : visiteur.statut === "Non intéressé" ? "#fff5f5" : "#f0f7ff", borderRadius:8, border:`1px solid ${visiteur.statut === "Inscrit" ? "#9ae6b4" : visiteur.statut === "Non intéressé" ? "#feb2b2" : "#bee3f8"}` }}>
        <div style={{ fontSize:13, fontWeight:600, color: visiteur.statut === "Inscrit" ? C.green : visiteur.statut === "Non intéressé" ? C.red : C.navy }}>
          Statut : {visiteur.statut}
        </div>
        {canEdit && visiteur.statut === "Visiteur" && (
          <div style={{ display:"flex", gap:8 }}>
            <Btn small variant="primary" onClick={() => onConvertir(visiteur.id, "Inscrit")}>✓ Convertir en Étudiant</Btn>
            <Btn small variant="danger" onClick={() => onConvertir(visiteur.id, "Non intéressé")}>✗ Non intéressé</Btn>
          </div>
        )}
        {visiteur.statut === "Inscrit" && <Badge color={C.green}>✓ Converti en Étudiant</Badge>}
      </div>

      {/* Infos personnelles */}
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:11, fontWeight:700, color:C.orange, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:10 }}>Informations personnelles</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"6px 14px" }}>
          {[
            ["Nom", visiteur.nom], ["Prénom", visiteur.prenom], ["CIN", visiteur.cin],
            ["Date de naissance", visiteur.dateNaissance], ["Lieu de naissance", visiteur.lieuNaissance], ["Téléphone", visiteur.telephone],
            ["Email", visiteur.email], ["Ville", visiteur.ville], ["Quartier", visiteur.quartier],
            ["Adresse", visiteur.adresse],
          ].map(([label, val]) => (
            <div key={label} style={{ background:C.light, borderRadius:6, padding:"7px 10px" }}>
              <div style={{ fontSize:10, color:C.muted, marginBottom:2 }}>{label}</div>
              <div style={{ fontSize:12, fontWeight:600, color:C.navy }}>{val || "—"}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Baccalauréat */}
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:11, fontWeight:700, color:C.orange, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:10 }}>Baccalauréat & Formation souhaitée</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"6px 14px" }}>
          {[
            ["Année du Bac", visiteur.bacAnnee], ["Mention", visiteur.bacMention], ["Série", visiteur.bacSerie],
            ["Établissement d'origine", visiteur.etablissement], ["Filière souhaitée", visiteur.filiereS], ["Date de visite", visiteur.dateVisite],
          ].map(([label, val]) => (
            <div key={label} style={{ background:C.light, borderRadius:6, padding:"7px 10px" }}>
              <div style={{ fontSize:10, color:C.muted, marginBottom:2 }}>{label}</div>
              <div style={{ fontSize:12, fontWeight:600, color:C.navy }}>{val || "—"}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Tarif */}
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:11, fontWeight:700, color:C.orange, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:10 }}>
          Tarif de formation — Total : {totalTarif.toLocaleString()} MAD | Payé : {totalPaye.toLocaleString()} MAD | Reste : {(totalTarif - totalPaye).toLocaleString()} MAD
        </div>
        <div style={{ border:`1px solid ${C.border}`, borderRadius:8, overflow:"hidden" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
            <thead>
              <tr style={{ background:C.light }}>
                {["Tranche", "Montant (MAD)", "Échéance", "Statut"].map(h => (
                  <th key={h} style={{ padding:"8px 12px", textAlign:"left", fontWeight:600, color:"#555", fontSize:11 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {tarif.map((t, i) => (
                <tr key={i} style={{ borderTop:`1px solid ${C.light}` }}>
                  <td style={{ padding:"8px 12px" }}>{t.tranche}</td>
                  <td style={{ padding:"8px 12px", fontWeight:600 }}>{t.montant.toLocaleString()} MAD</td>
                  <td style={{ padding:"8px 12px" }}>{t.echeance}</td>
                  <td style={{ padding:"8px 12px" }}>
                    <Badge color={t.paye ? C.green : C.orange}>{t.paye ? "✓ Payé" : "En attente"}</Badge>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Documents */}
      <div>
        <div style={{ fontSize:11, fontWeight:700, color:C.orange, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:10 }}>Pièces jointes</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:10 }}>
          {["CIN / Carte d'identité", "Relevé de notes Bac", "Diplôme ou attestation", "Photo d'identité", "Autre document"].map(type => (
            <label key={type} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 12px", border:`1px dashed ${C.border}`, borderRadius:8, cursor:"pointer", fontSize:12, color:C.navy, background:C.light }}>
              <span>📎</span> {type}
              <input type="file" style={{ display:"none" }} onChange={e => handleUpload(e, type)} />
            </label>
          ))}
        </div>
        {doc.length > 0 && (
          <div>
            {doc.map((d, i) => (
              <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 12px", background:C.light, borderRadius:6, marginBottom:4, fontSize:12 }}>
                <span>📄 {d.type} — {d.nom}</span>
                <span style={{ color:C.muted }}>{d.date} · {d.taille}</span>
              </div>
            ))}
          </div>
        )}
        {doc.length === 0 && <div style={{ fontSize:12, color:C.muted, textAlign:"center", padding:12 }}>Aucun document uploadé</div>}
      </div>
    </Modal>
  );
}

function Visiteurs({ data, setData, role, toast }) {
  const canEdit = ["administrateur", "directrice"].includes(role);
  const [showModal, setShowModal] = useState(false);
  const [showFiche, setShowFiche] = useState(null);
  const [search, setSearch] = useState("");
  const [filterStatut, setFilterStatut] = useState("");
  const [form, setForm] = useState({
    nom:"", prenom:"", cin:"", dateNaissance:"", lieuNaissance:"", telephone:"", email:"",
    adresse:"", ville:"", quartier:"", bacAnnee:"", bacMention:"Passable", bacSerie:"",
    etablissement:"", filiereS:"MGE", dateVisite: new Date().toISOString().split("T")[0],
    statut:"Visiteur", documents:[], tarif:[]
  });

  const genTarif = (filiere) => {
    const total = TARIFS_PAR_FILIERE[filiere] || 18000;
    const tranche = Math.round(total / 3);
    return [
      { tranche:"1ère tranche", montant:tranche, echeance:"2026-09-15", paye:false },
      { tranche:"2ème tranche", montant:tranche, echeance:"2027-01-15", paye:false },
      { tranche:"3ème tranche", montant:total - tranche*2, echeance:"2027-04-15", paye:false },
    ];
  };

  const filtered = (data.visiteurs || []).filter(v => {
    const matchSearch = `${v.nom} ${v.prenom} ${v.cin} ${v.telephone}`.toLowerCase().includes(search.toLowerCase());
    const matchStatut = !filterStatut || v.statut === filterStatut;
    return matchSearch && matchStatut;
  });

  const handleSave = () => {
    const newV = { ...form, id: Date.now(), tarif: genTarif(form.filiereS) };
    setData(d => ({ ...d, visiteurs: [...(d.visiteurs||[]), newV] }));
    toast("Visiteur enregistré dans SharePoint ✓");
    setShowModal(false);
    setForm({ nom:"", prenom:"", cin:"", dateNaissance:"", lieuNaissance:"", telephone:"", email:"", adresse:"", ville:"", quartier:"", bacAnnee:"", bacMention:"Passable", bacSerie:"", etablissement:"", filiereS:"MGE", dateVisite: new Date().toISOString().split("T")[0], statut:"Visiteur", documents:[], tarif:[] });
  };

  const handleConvertir = (id, newStatut) => {
    setData(d => ({
      ...d,
      visiteurs: d.visiteurs.map(v => v.id === id ? { ...v, statut: newStatut } : v),
      etudiants: newStatut === "Inscrit"
        ? [...d.etudiants, (() => { const v = d.visiteurs.find(x => x.id === id); return { id: Date.now(), nom: v.nom, prenom: v.prenom, cne: v.cin, filiere: v.filiereS, annee:"1ère", email: v.email, statut:"Actif", genre:"M" }; })()]
        : d.etudiants
    }));
    toast(newStatut === "Inscrit" ? "✓ Visiteur converti en Étudiant dans SharePoint !" : "Statut mis à jour dans SharePoint ✓");
    setShowFiche(null);
  };

  const stats = { total: (data.visiteurs||[]).length, visiteurs: (data.visiteurs||[]).filter(v=>v.statut==="Visiteur").length, inscrits: (data.visiteurs||[]).filter(v=>v.statut==="Inscrit").length, nonInt: (data.visiteurs||[]).filter(v=>v.statut==="Non intéressé").length };

  return (
    <div>
      <PageHeader
        title="Visiteurs & Prospects"
        sub={`${stats.total} visiteur(s) — liste SharePoint "${SP.lists.visiteurs}"`}
        action={canEdit && <Btn onClick={() => setShowModal(true)}>+ Nouveau visiteur</Btn>}
      />

      {/* Stats */}
      <div style={{ display:"flex", gap:12, marginBottom:20 }}>
        <StatCard label="Total visiteurs"   value={stats.total}    color={C.navy}   icon="👥" />
        <StatCard label="En attente"         value={stats.visiteurs} color={C.orange} icon="⏳" />
        <StatCard label="Inscrits"           value={stats.inscrits}  color={C.green}  icon="✅" />
        <StatCard label="Non intéressés"    value={stats.nonInt}   color={C.red}    icon="❌" />
        <StatCard label="Taux conversion"   value={stats.total ? `${Math.round(stats.inscrits/stats.total*100)}%` : "—"} color={C.purple} icon="📈" />
      </div>

      {/* Filtres */}
      <div style={{ display:"flex", gap:10, marginBottom:14, flexWrap:"wrap" }}>
        <input placeholder="🔍 Rechercher nom, CIN, téléphone..." value={search} onChange={e => setSearch(e.target.value)}
          style={{ flex:1, minWidth:200, padding:"9px 14px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, fontFamily:"inherit" }} />
        {["", "Visiteur", "Inscrit", "Non intéressé"].map(s => (
          <button key={s} onClick={() => setFilterStatut(s)} style={{
            padding:"8px 14px", borderRadius:20, border:`1px solid ${C.border}`, cursor:"pointer",
            background: filterStatut === s ? C.navy : C.white, color: filterStatut === s ? C.white : "#555",
            fontSize:12, fontFamily:"inherit"
          }}>{s || "Tous"}</button>
        ))}
      </div>

      <Card style={{ overflow:"hidden" }}>
        <DataTable
          cols={[
            { key:"prenom",      label:"Prénom" },
            { key:"nom",         label:"Nom" },
            { key:"cin",         label:"CIN" },
            { key:"telephone",   label:"Téléphone" },
            { key:"ville",       label:"Ville" },
            { key:"filiereS",    label:"Filière souhaitée" },
            { key:"dateVisite",  label:"Date visite" },
            { key:"statut",      label:"Statut", render: v => <Badge color={v==="Inscrit"?C.green:v==="Non intéressé"?C.red:C.orange}>{v}</Badge> },
            { key:"id", label:"Fiche", render: (_, row) => (
              <Btn small variant="navy" onClick={() => setShowFiche(row)}>Voir fiche</Btn>
            )},
          ]}
          rows={filtered}
          emptyMsg="Aucun visiteur enregistré"
        />
      </Card>

      {/* Modal ajout */}
      {showModal && (
        <Modal title="Nouveau visiteur → SharePoint" onClose={() => setShowModal(false)} width={640}>
          <div style={{ fontSize:11, fontWeight:700, color:C.orange, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:10 }}>Informations personnelles</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"0 14px" }}>
            <Input label="Nom *" value={form.nom} onChange={e => setForm(f=>({...f,nom:e.target.value}))} />
            <Input label="Prénom *" value={form.prenom} onChange={e => setForm(f=>({...f,prenom:e.target.value}))} />
            <Input label="CIN *" value={form.cin} onChange={e => setForm(f=>({...f,cin:e.target.value}))} />
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 14px" }}>
            <Input label="Date de naissance" type="date" value={form.dateNaissance} onChange={e => setForm(f=>({...f,dateNaissance:e.target.value}))} />
            <Input label="Lieu de naissance" value={form.lieuNaissance} onChange={e => setForm(f=>({...f,lieuNaissance:e.target.value}))} />
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 14px" }}>
            <Input label="Téléphone *" value={form.telephone} onChange={e => setForm(f=>({...f,telephone:e.target.value}))} placeholder="06XXXXXXXX" />
            <Input label="Email" type="email" value={form.email} onChange={e => setForm(f=>({...f,email:e.target.value}))} />
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"0 14px" }}>
            <Input label="Adresse" value={form.adresse} onChange={e => setForm(f=>({...f,adresse:e.target.value}))} />
            <Input label="Ville" value={form.ville} onChange={e => setForm(f=>({...f,ville:e.target.value}))} />
            <Input label="Quartier" value={form.quartier} onChange={e => setForm(f=>({...f,quartier:e.target.value}))} />
          </div>

          <div style={{ fontSize:11, fontWeight:700, color:C.orange, textTransform:"uppercase", letterSpacing:"0.08em", margin:"10px 0" }}>Baccalauréat & Formation</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"0 14px" }}>
            <Input label="Année du Bac" value={form.bacAnnee} onChange={e => setForm(f=>({...f,bacAnnee:e.target.value}))} placeholder="2024" />
            <Sel label="Mention" value={form.bacMention} onChange={e => setForm(f=>({...f,bacMention:e.target.value}))}>
              <option>Très bien</option><option>Bien</option><option>Assez bien</option><option>Passable</option>
            </Sel>
            <Input label="Série du Bac" value={form.bacSerie} onChange={e => setForm(f=>({...f,bacSerie:e.target.value}))} placeholder="Sciences Éco..." />
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"0 14px" }}>
            <Input label="Établissement d'origine" value={form.etablissement} onChange={e => setForm(f=>({...f,etablissement:e.target.value}))} />
            <Sel label="Filière souhaitée" value={form.filiereS} onChange={e => setForm(f=>({...f,filiereS:e.target.value}))}>
              {FILIERES.map(f => <option key={f}>{f}</option>)}
            </Sel>
            <Input label="Date de visite" type="date" value={form.dateVisite} onChange={e => setForm(f=>({...f,dateVisite:e.target.value}))} />
          </div>

          <div style={{ background:"#f0f7ff", border:"1px solid #bee3f8", borderRadius:8, padding:"10px 14px", fontSize:12, color:"#2b6cb0", marginBottom:14 }}>
            💰 Tarif filière <strong>{form.filiereS}</strong> : <strong>{(TARIFS_PAR_FILIERE[form.filiereS]||18000).toLocaleString()} MAD</strong> en 3 tranches · Données enregistrées dans SharePoint <strong>ECOGEST</strong>
          </div>

          <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
            <Btn variant="light" onClick={() => setShowModal(false)}>Annuler</Btn>
            <Btn onClick={handleSave} disabled={!form.nom||!form.prenom||!form.cin||!form.telephone}>Enregistrer → SharePoint</Btn>
          </div>
        </Modal>
      )}

      {/* Fiche visiteur */}
      {showFiche && (
        <FicheVisiteur
          visiteur={showFiche}
          onClose={() => setShowFiche(null)}
          onConvertir={handleConvertir}
          canEdit={canEdit}
        />
      )}
    </div>
  );
}

    `&scope=${encodeURIComponent(MSAL_CONFIG.scopes.join(" "))}` +
    `&response_mode=fragment` +
    `&nonce=${Math.random().toString(36).substring(2)}` +
    `&prompt=select_account`;

  return new Promise((resolve, reject) => {
    const popup = window.open(authorizeUrl, "msalPopup", "width=500,height=600,left=300,top=100");
    const timer = setInterval(() => {
      try {
        if (popup.closed) { clearInterval(timer); reject(new Error("Popup fermé")); return; }
        const hash = popup.location.hash;
        if (hash && hash.includes("access_token")) {
          clearInterval(timer);
          popup.close();
          const params = new URLSearchParams(hash.substring(1));
          resolve(params.get("access_token"));
        }
      } catch (e) {}
    }, 500);
    setTimeout(() => { clearInterval(timer); if (!popup.closed) popup.close(); reject(new Error("Timeout")); }, 120000);
  });
}

async function getUserInfo(token) {
  const res = await fetch("https://graph.microsoft.com/v1.0/me?$select=displayName,mail,userPrincipalName,jobTitle", {
    headers: { Authorization: `Bearer ${token}` }
  });
  return await res.json();
}

function LoginScreen({ onLogin }) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const handleMicrosoftLogin = async () => {
    setLoading(true);
    setError("");
    try {
      const token = await msalLogin();
      const userInfo = await getUserInfo(token);
      const email = (userInfo.mail || userInfo.userPrincipalName || "").toLowerCase();
      const userConfig = USER_ROLES[email];

      if (!userConfig) {
        setError(`Accès non autorisé pour ${email}. Contactez l'administrateur.`);
        setLoading(false);
        return;
      }

      onLogin(userConfig.role, { email, nom: userConfig.nom, token });
    } catch (err) {
      if (err.message === "Popup fermé") {
        setError("Connexion annulée.");
      } else {
        setError("Erreur de connexion. Réessayez.");
      }
      setLoading(false);
    }
  };

  return (
    <div style={{ minHeight: "100vh", background: `linear-gradient(135deg, ${C.navy} 0%, #2d4a8a 100%)`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Segoe UI', system-ui, sans-serif" }}>

          <div style={{ width: 70, height: 70, borderRadius: 18, background: C.navy, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 32, margin: "0 auto 16px" }}>🎓</div>
          <h1 style={{ color: C.navy, margin: 0, fontSize: 26, fontWeight: 700, letterSpacing: "-0.5px" }}>ECOGEST</h1>
          <p style={{ color: C.muted, fontSize: 13, margin: "6px 0 0" }}>École Supérieure de Rabat</p>
          <div style={{ width: 40, height: 3, background: C.orange, borderRadius: 2, margin: "12px auto 0" }}></div>
        </div>

        {/* Info */}
        <div style={{ background: "#f0f7ff", border: "1px solid #bee3f8", borderRadius: 10, padding: "12px 16px", fontSize: 12.5, color: "#2b6cb0", marginBottom: 24, lineHeight: 1.6 }}>
          🔐 Connexion sécurisée via votre compte <strong>Microsoft 365</strong><br />
          <span style={{ color: C.muted }}>@esrmi.ma — École Supérieure de Rabat</span>
        </div>

        {/* Rôles info */}
        <div style={{ marginBottom: 24 }}>
          {[
            { icon: "👩‍💼", label: "Directrice", desc: "fz.zniber@esrmi.ma", color: C.purple },
            { icon: "⚙️",  label: "Administrateurs", desc: "i.elmzioui · k.bouabid · a.bahalla", color: C.navy },
            { icon: "👨‍🏫", label: "Professeurs", desc: "Accès notes & présences", color: C.green },
            { icon: "🎓",  label: "Étudiants", desc: "Consultation uniquement", color: C.orange },
          ].map((r, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0", borderBottom: i < 3 ? `1px solid ${C.light}` : "none" }}>
              <span style={{ fontSize: 18 }}>{r.icon}</span>
              <div>
                <span style={{ fontSize: 12.5, fontWeight: 600, color: r.color }}>{r.label}</span>
                <span style={{ fontSize: 11, color: C.muted, marginLeft: 8 }}>{r.desc}</span>
              </div>
